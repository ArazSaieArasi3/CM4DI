schema_version: '1.0'
artifact: CM4DI Journal V2 Wave-7 Module Graph
research_line: CM4DI journal-v2
issue: 58
status: engineering_baseline_candidate
semantic_baseline: Gate-C plus approved DDD alignment

claim_boundary:
  - This graph packages frozen semantic ownership for formal engineering; it does not change Gate-C concept identity.
  - Module membership is not equivalent to Domain, Bounded Context, or Profile membership.
  - No OWL, SHACL, reasoner, CQ, CI, release, or public-IRI PASS is asserted by this artifact.
  - Public namespace registration remains a separate owner/release action.

source_of_truth:
  module_architecture_input: model/journal-v2/ddd/WAVE7_MODULE_ARCHITECTURE_INPUT.md
  bounded_context_registry: model/journal-v2/ddd/BOUNDED_CONTEXT_REGISTRY_v2.csv
  concept_domain_assignment: model/journal-v2/ddd/CONCEPT_DOMAIN_ASSIGNMENT_v2.csv
  core_concept_registry: model/journal-v2/CM4DI_CORE_CONCEPT_REGISTRY_v2.csv
  core_relation_registry: model/journal-v2/CM4DI_CORE_RELATION_REGISTRY_GATE_C.csv
  profile_concept_registry: model/journal-v2/profiles/PROFILE_CONCEPT_REGISTRY_v2.csv
  profile_relation_registry: model/journal-v2/profiles/PROFILE_RELATION_REGISTRY_v2.csv

iri_policy:
  status: internal_engineering_iri_until_public_namespace_decision
  ontology_iri_pattern: 'urn:cm4di:ontology:{module_id}'
  version_iri_pattern: 'urn:cm4di:ontology:{module_id}:journal-v2:w7'
  public_w3id_or_http_registration_asserted: false

invariants:
  - id: MG-I01
    rule: core_imports_no_extension
  - id: MG-I02
    rule: every_governed_concept_owned_exactly_once
  - id: MG-I03
    rule: aggregate_profiles_own_no_entities
  - id: MG-I04
    rule: imports_must_be_acyclic
  - id: MG-I05
    rule: shared_semantics_not_promoted_to_core_without_separate_semantic_decision
  - id: MG-I06
    rule: device_and_agent_must_not_import_workload_merely_for_profile_membership
  - id: MG-I07
    rule: technical_trust_domain_bundle_not_equated_with_institutional_trust_framework_registry
  - id: MG-I08
    rule: linkedAccount_must_not_imply_owl_sameAs_or_subject_identity

