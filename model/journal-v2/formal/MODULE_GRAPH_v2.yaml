formalization_handoff:
  next_steps_after_graph_acceptance:
    - project frozen concept and relation registries into module OWL sources
    - document UFO/OntoUML-to-OWL projection decisions
    - divide conceptual constraints between OWL and SHACL according to open-world versus closed-world semantics
    - generate deterministic serializations
    - compile CQ ownership and SPARQL query suite by module
    - run local or governed ROBOT/HermiT/SHACL validation before any formal PASS claim
  public_release_allowed: false
