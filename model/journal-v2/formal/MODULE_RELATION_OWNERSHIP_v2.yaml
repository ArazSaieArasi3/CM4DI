ownership_rule:
  - All 55 frozen Gate-C Core relations remain owned by the Core module.
  - A profile relation whose only extension-specific endpoint belongs to one module is owned by that module.
  - If both endpoints are extension-specific in different modules, ownership follows the relation's contextual semantic source/initiating construct and must not imply entity migration.
  - Aggregate Profiles own no relation definitions.
  - Relation ownership is packaging/provenance, not a change to Gate-C or Wave-6 semantics.

