critical_modeling_decisions:
  - Party and IdentitySubject are abstract roleMixins, not rigid universal kinds.
  - Evidence and Proof are roleMixins, permitting credentials/documents/assertions/attestations to play evidential roles.
  - IdentityBinding, AccessGrant and Delegation are relators.
  - IdentityProofing, Enrollment, Authentication and Authorization are distinct events.
  - AuthenticationResult and AuthorizationResult are result information artifacts, not event occurrences.
  - IdentityContext and AuthorizationContext are distinct situations.
  - Account, Session, Federation, Wallet, TrustFramework, LegalIdentity, Workload, Device and AI Agent are profile-first.
  - No MachineIdentity superclass.
  - SocialIdentity remains future/external; SocialLogin is P01 federation/authentication mapping.

